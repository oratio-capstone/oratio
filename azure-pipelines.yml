trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
  displayName: 'Set up Python'

- script: |
    pip install -U platformio
  displayName: 'Install PlatformIO'

- script: |
    pio run -e esp32-c3-devkitm-1
  displayName: 'Build ESP32-C3'
  workingDirectory: '$(Build.SourcesDirectory)/fw'

# Once you have tests under fw/test/, add:
# - script: pio test -e esp32-c3-devkitm-1
#   displayName: 'Run tests (ESP32-C3)'
#   workingDirectory: '$(Build.SourcesDirectory)/fw'