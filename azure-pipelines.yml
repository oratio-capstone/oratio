trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Keep PlatformIO's downloads in a folder the cache can save and restore.
  PLATFORMIO_CORE_DIR: $(Pipeline.Workspace)/.platformio

steps:
# Depth 2: a PR build checks out GitHub's merge commit, and the change detection
# below compares it with its first parent (main).
- checkout: self
  fetchDepth: 2

# Decide which parts to check. One pipeline (one required check) that skips what a PR
# didn't touch: skipped steps still count as passed, so a sw/-only PR is never left
# waiting on a firmware check. Pushes to main always run everything, and anything
# unclear runs everything too.
- script: |
    run_all() { echo "Running everything: $1"; echo "##vso[task.setvariable variable=RUN_FW]true"; echo "##vso[task.setvariable variable=RUN_SW]true"; exit 0; }
    [ "$BUILD_REASON" = "PullRequest" ] || run_all "not a pull request ($BUILD_REASON)"
    git rev-parse -q --verify HEAD^2 >/dev/null || run_all "not a merge commit"
    changed=$(git diff --name-only HEAD^1 HEAD) || run_all "could not list changed files"
    echo "Files changed by this PR:"; echo "$changed" | sed 's/^/  /'
    fw=false; sw=false
    echo "$changed" | grep -qE '^(fw/|azure-pipelines\.yml$)' && fw=true
    echo "$changed" | grep -qE '^(sw/|azure-pipelines\.yml$)' && sw=true
    echo "Firmware checks: $fw    Gateway checks: $sw"
    echo "##vso[task.setvariable variable=RUN_FW]$fw"
    echo "##vso[task.setvariable variable=RUN_SW]$sw"
  displayName: 'Detect what changed'

# Pinned: '3.x' now resolves to Python 3.15 on ubuntu-latest, and the
# espressif32 platform only supports Python 3.10-3.14.
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
  displayName: 'Set up Python'

# Pinned to match the platform in fw/platformio.ini (54.03.21-2 needs Core >= 6.1.18).
# Upgrade both together, on purpose; never use "pip install -U".
- script: |
    pip install "platformio==6.1.19"
  displayName: 'Install PlatformIO (pinned)'
  condition: and(succeeded(), eq(variables['RUN_FW'], 'true'))

# Reuses the downloaded ESP-IDF between runs. The key includes platformio.ini,
# so changing the platform version starts a fresh cache automatically.
- task: Cache@2
  inputs:
    key: 'platformio | "$(Agent.OS)" | fw/platformio.ini'
    path: $(PLATFORMIO_CORE_DIR)
  displayName: 'Cache PlatformIO toolchain'
  condition: and(succeeded(), eq(variables['RUN_FW'], 'true'))

# The S3 firmware: the mesh roles and the audio build.
# Retries cover GitHub download timeouts (HTTP 504) while installing the toolchain.
- script: |
    pio run -e root -e node -e esp32-s3-n8r8
  displayName: 'Build firmware (root, node, S3 audio)'
  workingDirectory: '$(Build.SourcesDirectory)/fw'
  retryCountOnTaskFailure: 2
  condition: and(succeeded(), eq(variables['RUN_FW'], 'true'))

# The tests in fw/test/ run on real boards (they flash a board and talk to it over
# serial), and CI has none. So CI only checks that every test still COMPILES for
# the environment it is written for; passing them is still a hardware job.
- script: |
    pio test -e node_test \
      -f test_102_mesh -f test_106_udp -f test_109_heartbeat -f test_113_relay -f test_155_protocol \
      --without-uploading --without-testing
  displayName: 'Compile tests: networking (node_test)'
  workingDirectory: '$(Build.SourcesDirectory)/fw'
  retryCountOnTaskFailure: 2
  condition: and(succeeded(), eq(variables['RUN_FW'], 'true'))

- script: |
    pio test -e esp32-s3-n8r8 -f test_157_audio_capture -f test_audio \
      --without-uploading --without-testing
  displayName: 'Compile tests: audio (esp32-s3-n8r8)'
  workingDirectory: '$(Build.SourcesDirectory)/fw'
  retryCountOnTaskFailure: 2
  condition: and(succeeded(), eq(variables['RUN_FW'], 'true'))

# Gateway (Python) tests. Skips itself until the gateway tests are on this branch
# (sw/pytest.ini), so it switches on by itself when they merge.
- script: |
    if [ ! -f sw/pytest.ini ]; then
      echo "No sw/pytest.ini on this branch yet; skipping gateway tests."
      exit 0
    fi
    pip install -r sw/requirements-dev.txt
    cd sw && python -m pytest -q
  displayName: 'Gateway tests (pytest)'
  workingDirectory: '$(Build.SourcesDirectory)'
  condition: and(succeeded(), eq(variables['RUN_SW'], 'true'))

# A build rewrites fw/dependencies.lock when it no longer matches the components the
# manifest resolves to. CI builds from a clean machine, so if the lock changed here,
# the committed one is stale: fail and print the file to commit, so every laptop and
# CI resolve exactly the same component versions.
- script: |
    if git diff --quiet -- fw/dependencies.lock; then
      echo "fw/dependencies.lock is up to date."
      exit 0
    fi
    echo "##vso[task.logissue type=error]fw/dependencies.lock is out of date. Commit the regenerated file printed below."
    git --no-pager diff -- fw/dependencies.lock
    echo "----- regenerated fw/dependencies.lock -----"
    cat fw/dependencies.lock
    exit 1
  displayName: 'Check dependencies.lock is committed'
  condition: and(succeeded(), eq(variables['RUN_FW'], 'true'))
