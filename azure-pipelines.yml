trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
  displayName: 'Set up Python'

- script: |
    pip install -U platformio
  displayName: 'Install PlatformIO'

- script: |
    pio run -e esp32-c3-devkitm-1
  displayName: 'Build ESP32-C3'
  workingDirectory: '$(Build.SourcesDirectory)/fw'

- script: |
    python tools/test_audio_output.py
  displayName: 'Check audio output contracts (host GCC)'
  workingDirectory: '$(Build.SourcesDirectory)/fw'

- script: |
    pio run -e audio_output_test
  displayName: 'Build standalone speaker tone firmware (ESP32-C3)'
  workingDirectory: '$(Build.SourcesDirectory)/fw'

# Once you add [env:esp32-s3-devkitc-1] (or similar) to platformio.ini, add:
# - script: pio run -e esp32-s3-devkitc-1
#   displayName: 'Build ESP32-S3'
