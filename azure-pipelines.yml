trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
# Pinned: '3.x' now resolves to Python 3.15 on ubuntu-latest, and the
# espressif32 platform only supports Python 3.10-3.14.
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
  displayName: 'Set up Python'

# Pinned to match the platform in fw/platformio.ini (54.03.21-2 needs Core >= 6.1.18).
# Upgrade both together, on purpose; never use "pip install -U".
- script: |
    pip install "platformio==6.1.19"
  displayName: 'Install PlatformIO (pinned)'

- script: |
    pio run -e esp32-c3-devkitm-1
  displayName: 'Build ESP32-C3'
  workingDirectory: '$(Build.SourcesDirectory)/fw'

# Once you have tests under fw/test/, add:
# - script: |
#     pio test -e esp32-c3-devkitm-1
#   displayName: 'Run tests (ESP32-C3)'
#   workingDirectory: '$(Build.SourcesDirectory)/fw'

# Once you add [env:esp32-s3-devkitc-1] (or similar) to platformio.ini, add:
# - script: pio run -e esp32-s3-devkitc-1
#   displayName: 'Build ESP32-S3'