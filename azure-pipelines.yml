trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main
      - mohamed/feature/147-audio-output-driver
      - mohamed/feature/161-audio-playback-library

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
  displayName: 'Set up Python'

- script: |
    pip install -U platformio
  displayName: 'Install PlatformIO'

- script: |
    pio run -e esp32-c3-devkitm-1
  displayName: 'Build ESP32-C3'
  workingDirectory: '$(Build.SourcesDirectory)/fw'

- script: |
    python tools/test_audio_output.py
  displayName: 'Check audio output contracts (host GCC)'
  workingDirectory: '$(Build.SourcesDirectory)/fw'

- script: |
    pio run -e audio_output_test
  displayName: 'Build standalone speaker tone firmware (ESP32-C3)'
  workingDirectory: '$(Build.SourcesDirectory)/fw'

- script: |
    python tools/test_audio_playback.py
  displayName: 'Check playback service contracts (host threads)'
  workingDirectory: '$(Build.SourcesDirectory)/fw'

- script: |
    set -e
    python tools/prepare_playback_fixture.py --check
    python tools/test_playback_fixture.py
    python tools/test_playback_application.py
  displayName: 'Validate speech fixture and playback application checks'
  workingDirectory: '$(Build.SourcesDirectory)/fw'

- script: |
    pio run -e audio_playback_test
  displayName: 'Build prerecorded speech playback test (ESP32-C3)'
  workingDirectory: '$(Build.SourcesDirectory)/fw'

# Once an ESP32-S3 environment is available, add its build here.
# - script: pio run -e esp32-s3-devkitc-1
#   displayName: 'Build ESP32-S3'
