trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
  displayName: 'Set up Python'

# Pin the toolchain so builds don't break when upstream releases change.
# pioarduino 6.2.0.post1 (published 2026-10-26) is rejected by the espressif32
# platform's engine check ("not compatible with PlatformIO Core v6.2.0-post.1"),
# so the platform's own Python env is constrained to 6.2.0 via UV_CONSTRAINT.
# See pioarduino/platform-espressif32#563. Remove the constraint once a platform
# release with the engine fix is pinned in fw/platformio.ini.
- script: |
    pip install "platformio==6.2.0"
    echo "pioarduino==6.2.0" > "$(Agent.TempDirectory)/pio-constraints.txt"
    echo "##vso[task.setvariable variable=UV_CONSTRAINT]$(Agent.TempDirectory)/pio-constraints.txt"
  displayName: 'Install PlatformIO (pinned)'

- script: |
    pio run -e esp32-c3-devkitm-1
  displayName: 'Build ESP32-C3'
  workingDirectory: '$(Build.SourcesDirectory)/fw'

# Once you have tests under fw/test/, add:
# - script: |
#     pio test -e esp32-c3-devkitm-1
#   displayName: 'Run tests (ESP32-C3)'
#   workingDirectory: '$(Build.SourcesDirectory)/fw'

# Once you add [env:esp32-s3-devkitc-1] (or similar) to platformio.ini, add:
# - script: pio run -e esp32-s3-devkitc-1
#   displayName: 'Build ESP32-S3'