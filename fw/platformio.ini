; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
core_dir = ${sysenv.USERPROFILE}/.platformio-oratio-idf54

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
upload_speed = 115200
monitor_speed = 115200
test_build_src = yes

[env:root]
build_flags =
    -D APP_IS_ROOT=1

[env:node]
build_flags =
    -D APP_IS_ROOT=0

[env:root_test]
extends = env:root
build_flags =
    ${env:root.build_flags}
    -D APP_TEST_BUILD=1

[env:node_test]
extends = env:node
build_flags =
    ${env:node.build_flags}
    -D APP_TEST_BUILD=1