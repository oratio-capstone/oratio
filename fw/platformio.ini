; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

; Shared by every environment below. Change the platform version here only,
; so all boards and test builds use the same ESP-IDF.
[env]
; Team version: 54.03.21-2 (ESP-IDF 5.4.2), the release the mesh firmware was
; developed on. Pinned because the "stable" URL moves without notice and can
; require a different PlatformIO Core, which breaks builds with no repo change.
; Requires PlatformIO Core >= 6.1.18 (CI uses 6.1.19).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
framework = espidf


[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

; N8R8: 8 MB quad flash. Audio uses internal RAM; PSRAM is not required.
; These console settings use the S3's native USB connector, not a UART bridge.
[env:esp32-s3-n8r8]
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.audio_s3.defaults
monitor_speed = 115200
