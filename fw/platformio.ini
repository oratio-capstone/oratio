; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
core_dir = ${PROJECT_DIR}/.pio-core

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
upload_speed = 115200
monitor_speed = 115200
test_build_src = yes

; 1 for detailed network diagnostics; 0 for streaming measurements.
build_flags =
    -D ORATIO_NETWORK_DEBUG=0
    ; Tasks 113 & 115 0 = task 113 (1000 packets), 1 = task 115 (continuous 640-byte frames).
    ; Use same mode on producer and consumer; 
    -D TEST_CONTINUOUS_STREAM=1
    ; 1 = task 116 benchmark; 0 = use the 113/115 selection above.
    -D TEST_BENCHMARK=1

[env:root]
build_flags =
    ${env.build_flags}
    -D APP_IS_ROOT=1

[env:node]
build_flags =
    ${env.build_flags}
    -D APP_IS_ROOT=0

[env:root_test]
extends = env:root
build_flags =
    ${env:root.build_flags}
    -D APP_TEST_BUILD=1
    -D TEST_IS_PRODUCER=1

[env:node_test]
extends = env:node
build_flags =
    ${env:node.build_flags}
    -D APP_TEST_BUILD=1
    -D TEST_IS_PRODUCER=0

[env:node_level3_test]
extends = env:node_test
build_flags =
    ${env:node_test.build_flags}
    -D APP_FORCE_LEVEL3=1
