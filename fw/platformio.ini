[env:esp32-c3-devkitm-1]
; Pinned to a specific release: the "stable" URL moves without notice and can
; require a different PlatformIO Core, which breaks builds with no repo change.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = espidf
