; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = espidf

; AB#157 mic capture test (INMP441 on SCK=4, WS=5, SD=6): pio run -e audio_capture_test -t upload -t monitor
[env:audio_capture_test]
extends = env:esp32-c3-devkitm-1
board_build.cmake_extra_args = -DORATIO_AUDIO_CAPTURE_TEST=ON
monitor_speed = 115200

; ESP32-S3 (final hardware). PCB pins: mic SCK=39, WS=40, SD=41, PTT on GPIO 21.
[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf

; S3 mic capture test: pio run -e audio_capture_test_s3 -t upload -t monitor
[env:audio_capture_test_s3]
extends = env:esp32-s3-devkitc-1
board_build.cmake_extra_args = -DORATIO_AUDIO_CAPTURE_TEST=ON
monitor_speed = 115200
