; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Shared platform version for all boards and tests.
; ESP-IDF 5.4.2. Use PlatformIO Core 6.1.19 to match CI.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
framework = espidf
upload_speed = 115200
monitor_speed = 115200
; Network diagnostics are disabled for normal and measurement builds.
build_flags =
    -D ORATIO_NETWORK_DEBUG=0

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

[env:root]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D APP_IS_ROOT=1

[env:node]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D APP_IS_ROOT=0

[env:root_test]
extends = env:root
test_build_src = yes
build_flags =
    ${env:root.build_flags}
    -D APP_TEST_BUILD=1
    ; Benchmark takes precedence; set to 0 to use the continuous-stream selection.
    -D TEST_BENCHMARK=1
    -D TEST_CONTINUOUS_STREAM=1
    -D TEST_IS_PRODUCER=1

[env:node_test]
extends = env:node
test_build_src = yes
build_flags =
    ${env:node.build_flags}
    -D APP_TEST_BUILD=1
    ; Benchmark takes precedence; set to 0 to use the continuous-stream selection.
    -D TEST_BENCHMARK=1
    -D TEST_CONTINUOUS_STREAM=1
    -D TEST_IS_PRODUCER=0

[env:node_level3_test]
extends = env:node_test
build_flags =
    ${env:node_test.build_flags}
    -D APP_FORCE_LEVEL3=1
