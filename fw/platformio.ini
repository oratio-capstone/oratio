; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = espidf

[env:audio_test]
extends = env:esp32-c3-devkitm-1
test_framework = unity
test_filter = test_audio
test_build_src = no
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.audio_test.defaults
monitor_speed = 115200

; N8R8: 8 MB quad flash. Audio uses internal RAM; PSRAM is not required.
; These console settings use the S3's native USB connector, not a UART bridge.
[env:esp32-s3-n8r8]
platform = ${env:esp32-c3-devkitm-1.platform}
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 8MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.audio_s3.defaults
monitor_speed = 115200

[env:audio_test_s3]
extends = env:esp32-s3-n8r8
test_framework = unity
test_filter = test_audio
test_build_src = no
