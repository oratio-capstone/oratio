; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = espidf

; AB#157 microphone capture validation app: pio run -e audio_capture_test -t upload -t monitor
; Provisional pins, chosen to stay clear of the speaker (4, 5, 7), PTT button (10),
; strapping pins (2, 8, 9), USB (18, 19) and UART (20, 21). Match your wiring before uploading.
[env:audio_capture_test]
extends = env:esp32-c3-devkitm-1
board_build.cmake_extra_args = -DORATIO_AUDIO_CAPTURE_TEST=ON
monitor_speed = 115200
build_flags =
    -DORATIO_CAPTURE_TEST_BCLK_GPIO=0
    -DORATIO_CAPTURE_TEST_WS_GPIO=1
    -DORATIO_CAPTURE_TEST_DIN_GPIO=6
    -DORATIO_CAPTURE_TEST_GAIN_SHIFT=0
    -DORATIO_CAPTURE_TEST_SECONDS=10

; Same app, plus every frame exported over serial for tools/record_capture_wav.py
[env:audio_capture_record]
extends = env:audio_capture_test
build_flags =
    ${env:audio_capture_test.build_flags}
    -DORATIO_CAPTURE_TEST_RECORD=1