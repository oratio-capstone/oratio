pr: none
trigger:
  branches:
    include:
      - '*'

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    git clone --mirror https://github.com/oratio-capstone/oratio.git mirror
    cd mirror
    git push --mirror https://$(System.AccessToken)@dev.azure.com/capstoneProject4/Capstone%20Project/_git/oratio
  displayName: 'Mirror GitHub → Azure Repos'
