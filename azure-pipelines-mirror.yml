pr: none
trigger:
  branches:
    include:
      - '*'

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    git clone --mirror https://github.com/oratio-capstone/oratio.git mirror
    cd mirror

    # 1. Push all your branches to Azure Repos
    git push https://$(System.AccessToken)@dev.azure.com/capstoneProject4/Capstone%20Project/_git/oratio --all

    # 2. Push all your tags to Azure Repos
    git push https://$(System.AccessToken)@dev.azure.com/capstoneProject4/Capstone%20Project/_git/oratio --tags

  displayName: 'Mirror GitHub → Azure Repos'
